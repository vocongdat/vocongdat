# Snapshots the README stat cards into profile/ so the README never depends on a third-party service being up.
name: Profile stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake-light.svg
            profile/snake-dark.svg?palette=github-dark

      - name: Fetch stat cards
        env:
          U: ${{ github.repository_owner }}
        run: |
          # Keep the previous card when a service is down or returns garbage.
          fetch() { curl -sfL -m 60 "$2" -o /tmp/card.svg && grep -q '<svg' /tmp/card.svg && mv /tmp/card.svg "profile/$1" || echo "::warning::kept old $1"; }
          LANGS="https://github-readme-stats.vercel.app/api/top-langs/?username=$U&layout=compact&langs_count=8&hide=shaderlab,hlsl&hide_border=true&card_width=400"
          STREAK="https://streak-stats.demolab.com?user=$U&hide_border=true"
          fetch langs-light.svg  "$LANGS&theme=default"
          fetch langs-dark.svg   "$LANGS&theme=github_dark"
          fetch streak-light.svg "$STREAK&theme=default"
          fetch streak-dark.svg  "$STREAK&theme=github-dark-blue"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile
          git diff --cached --quiet || { git commit -m "chore: refresh profile stats" && git push; }
